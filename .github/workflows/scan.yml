name: Scan sources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-source-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Poll enabled public sources
        run: python run.py scan
      - name: Build and validate public data
        run: python run.py validate
      - name: Commit semantic data changes
        run: |
          if git diff --quiet -- data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update opportunity radar"
          git pull --rebase
          git push
      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-scan-diagnostics-${{ github.run_id }}
          path: |
            data/source_health.json
            data/review_queue.json
            data/possible_roles.json
          retention-days: 7
