name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: node --test tests/js/*.test.*
      - name: Validate live repository state, YAML, workflows and hygiene
        run: python run.py validate
      - name: Fixture end-to-end scan
        run: python run.py scan --fixtures
      - name: Validate isolated fixture state and static build
        run: python run.py validate --fixtures
      - name: Reject subscriber exports and secret files
        run: |
          test ! -e subscribers.csv
          test ! -e subscribers.json
          test ! -e .env
          ! git ls-files | grep -E '(^|/)(subscribers\.(csv|json)|\.env)$'
          git diff --exit-code -- data site/generated
