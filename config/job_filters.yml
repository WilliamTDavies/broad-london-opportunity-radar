# JOB FILTERS — THIS IS THE MAIN FILE TO EDIT
#
# After changing this file, run a new scan and rebuild the site. The rules are
# deliberately plain text: add one phrase per line, keeping the leading "-".
# Matching ignores capitalisation and punctuation and matches whole phrases.
#
# Inclusion terms only make a title eligible for the broad "Possible" layer.
# They never override an exclusion, location rule, unpaid flag, or explicit
# candidate-ineligibility evidence.

# If any phrase below appears in a title, description, or eligibility text, the
# role is ineligible and cannot appear in either the Verified or Possible layer.
# Use this for genuinely hard conflicts, especially explicit requirements.
