# JOB FILTERS - THIS IS THE MAIN FILE TO EDIT
#
# The dashboard admits only:
#   1. internships, vacation schemes, insight programmes and other short breaks; or
#   2. relevant professional roles with explicit part-time or term-time evidence.
#
# Matching ignores capitalisation and punctuation and uses whole phrases. An
# inclusion never overrides an exclusion, location rule, unpaid flag or explicit
# candidate-ineligibility evidence.

# Hard conflicts checked against title, description and eligibility. Keep this
# list limited to wording that is incompatible in every context.
always_exclude_if_text_contains:
  - graduates only
  - completed degree required
  - final year only
  - final year university students and recent graduates
  - designed for final year university students
  - law degree only
  - llb required
  - computer science degree required
  - engineering degree required
  - mathematics degree required
  - medical degree required
  - mba students only
  - masters students only
  - master's students only
  - phd students only
  - school leaver
  - apprenticeship
  - unpaid
  - software engineering internship
  - software development internship
  - machine learning internship
  - data science internship
  - quantitative research internship
  - quant research internship
  - quantitative trading internship
  - quant trading internship
  - quantitative developer internship
  - quant developer internship
  - actuarial internship
  - engineering internship
  - clinical research internship
  - laboratory research internship
  - phd intern
  - bioinformatics
  - synthetic biology
  - metabolomic
  - quantum error correction
  - strong C++ programming skills
  - C++ required
  - C++ is required
  - must have C++
  - proficiency in C++
  - proficient in C++
  - advanced C++
  - commercial C++ experience
  - professional C++ experience
  - C++ programming experience required
  - experience with C++ required
  - experienced compliance professional

# These title phrases establish that the work is designed around a university
# break or is a short early-career programme. A summer internship may say it is
# full-time; that is valid because it runs during a break.
programme_title_inclusions:
  - intern
  - internship
  - vacation scheme
  - spring week
  - spring insight
  - insight week
  - insight programme
  - insight program
  - insight day
  - work experience
  - summer analyst
  - summer associate
  - summer placement
  - winter internship
  - winter project
  - winter programme
  - winter program
  - micro internship

# An ordinary role must contain one of these professional areas in its TITLE and
# must also contain availability evidence from the next list. Generic titles such
# as "assistant", "analyst" and "officer" no longer qualify by themselves.
part_time_professional_title_inclusions:
  - compliance
  - anti money laundering
  - aml
  - know your customer
  - kyc
  - financial crime
  - risk
  - regulatory
  - internal audit
  - governance
  - finance
  - financial
  - accounting
  - investment
  - asset management
  - wealth management
  - banking
  - credit
  - legal
  - paralegal
  - law
  - consulting
  - consultancy
  - strategy
  - policy
  - public affairs
  - government affairs
  - corporate affairs
  - economics
  - economic
  - due diligence
  - commercial analysis
  - research

# Evidence that an ordinary professional role can fit alongside university.
# The code also recognises explicit schedules of 24 hours per week or fewer.
part_time_availability_evidence:
  - part time
  - term time
  - weekend only
  - weekends only
  - evenings only
  - casual contract
  - zero hours
  - flexible part time
  - part time considered
  - job share
  - 0.5 fte
  - 0.4 fte
  - 0.3 fte
  - 0.2 fte

# Long placements and contracts are incompatible even when their titles say
# internship or part-time. Use duration wording here, not bare numbers.
long_duration_exclusions:
  - 4 month internship
  - 4 months internship
  - intern for 4 months
  - 4 months ftc
  - 5 month internship
  - 5 months internship
  - intern for 5 months
  - 5 months ftc
  - 6 month internship
