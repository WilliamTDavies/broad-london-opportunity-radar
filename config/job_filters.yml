  - one year placement
  - one year work placement
  - industrial placement
  - year in industry
  - off cycle
  - offcycle

# These describe ordinary employment. They exclude non-programme roles only, so
# "full-time summer internship" remains valid.
ordinary_job_exclusions:
  - full time
  - permanent

# Research is admitted only when the TITLE also establishes a finance, markets,
# economics, compliance or risk context. This removes medical and science noise.
research_title_signals:
  - research
  - researcher

